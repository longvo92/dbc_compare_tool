name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
   inputs:
        tag:
          description: 'Tag to release (e.g., v1.0.0)'
          required: true
permissions:
  contents: write

env:
  ACTIONS_STEP_DEBUG: true



jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Show authenticated user
      shell: pwsh
      run: |
        $headers = @{
          Authorization = "Bearer ${{ secrets.RELEASE_REPO_TOKEN }}"
        }
    
        Invoke-RestMethod `
          -Uri "https://api.github.com/user" `
          -Headers $headers
    - name: Check release permission
      shell: pwsh
      run: |
        $headers = @{
          Authorization = "Bearer ${{ secrets.RELEASE_REPO_TOKEN }}"
          Accept = "application/vnd.github+json"
        }
    
        $body = @{
          tag_name = "test-tag"
          name = "Test Release"
          draft = $true
        } | ConvertTo-Json
    
        try {
          Invoke-RestMethod `
            -Method POST `
            -Uri "https://api.github.com/repos/longvo92/dbc_compare_released/releases" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json"
        }
        catch {
          Write-Host $_.Exception.Response.StatusCode
    
          $reader = New-Object System.IO.StreamReader(
            $_.Exception.Response.GetResponseStream()
          )
    
          $reader.ReadToEnd()
          throw
        }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pyinstaller pytest

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Build executable
      run: |
        pyinstaller packaging/dbc_compare_tool.spec --clean

    - name: Extract version
      id: version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}" -replace "^v", ""
        "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Package release
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release

        if (Test-Path "dist\DBCCompareTool.exe") {
            Copy-Item "dist\DBCCompareTool.exe" "release\"
        }
        elseif (Test-Path "dist\DBCCompareTool") {
            Copy-Item "dist\DBCCompareTool" "release\" -Recurse
        }
        else {
            Write-Error "Build output not found"
            exit 1
        }

        Compress-Archive `
          -Path release\* `
          -DestinationPath DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip
    - name: Create release in public repo
      uses: softprops/action-gh-release@v2
      with:
        repository: longvo92/dbc_compare_released
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        name: DBC Compare Tool ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        files: |
          DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
