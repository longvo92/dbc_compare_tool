name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
   inputs:
        tag:
          description: 'Tag to release (e.g., v1.0.0)'
          required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Build executable
      run: |
        pyinstaller packaging/dbc_compare_tool.spec --clean

    - name: Extract version
      id: version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}" -replace "^v", ""
        "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Package release
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release

        if (Test-Path "dist\DBCCompareTool") {
            Copy-Item "dist\DBCCompareTool\*" "release\" -Recurse
        }
        else {
            Write-Error "Build output not found in dist\DBCCompareTool"
            exit 1
        }

        Compress-Archive `
          -Path release\* `
          -DestinationPath DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip

    #################################################################
    # CHECKOUT RELEASE REPO
    #################################################################

    - name: Checkout release repo
      uses: actions/checkout@v4
      with:
        repository: longvo92/dbc_compare_released
        token: ${{ secrets.RELEASE_REPO_TOKEN }}
        path: download_repo

    #################################################################
    # UPDATE DOWNLOAD REPO
    #################################################################

    - name: Update download repository files
      shell: pwsh
      run: |
        # Copy versioned package
        Copy-Item `
          "DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip" `
          "download_repo/DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip" `
          -Force

        # Generate version.json
        @"
        {
          "version": "${{ steps.version.outputs.VERSION }}"
        }
        "@ | Out-File `
          "download_repo/version.json" `
          -Encoding utf8

        # Update release notes
        if (Test-Path "resources/help/release_notes.md") {
          Copy-Item `
            "resources/help/release_notes.md" `
            "download_repo/release_notes.md" `
            -Force
        }
        else {
          "No release notes available" |
            Out-File "download_repo/release_notes.md"
        }

    #################################################################
    # COMMIT + PUSH
    #################################################################

    - name: Push download files
      shell: pwsh
      run: |
        cd download_repo

        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add .

        git diff --cached --quiet

        if ($LASTEXITCODE -ne 0)
        {
          git commit `
            -m "Release ${{ steps.version.outputs.VERSION }}"

          git push
        }
        else
        {
          Write-Host "No changes to commit"
        }

