name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pip install pytest
        pytest tests/ -v

    - name: Build executable
      run: |
        pyinstaller packaging/dbc_compare_tool.spec --clean

    - name: Get version
      id: version
      run: |
        $version = "${{ github.ref_name }}" -replace "^v", ""
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Prepare release artifacts
      run: |
        cd dist
        # Create a zip file with the executable
        $exePath = "DBCCompareTool"
        if (Test-Path $exePath) {
          Compress-Archive -Path $exePath -DestinationPath "../DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip"
        }
        cd ..

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip
        asset_name: DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip
        asset_content_type: application/zip
