name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run tests
      run: |
        pip install pytest
        pytest tests/ -v

    - name: Build executable
      run: |
        pyinstaller packaging/dbc_compare_tool.spec --clean

    - name: Get version
      id: version
      run: |
        $version = "${{ github.ref_name }}" -replace "^v", ""
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Prepare release artifacts
      run: |
        cd dist
        # Create a zip file with the executable
        $exePath = "DBCCompareTool"
        if (Test-Path $exePath) {
          Compress-Archive -Path $exePath -DestinationPath "../DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip"
        }
        cd ..

    - name: Create and Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: DBCCompareTool-${{ steps.version.outputs.VERSION }}-x64.zip
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
